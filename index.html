<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dude9anime</title>
    <style>
        :root {
            --bg-color: #050505;
            --container-bg: #111111;
            --accent-color: rgb(0, 255, 102); 
            --text-color: #ffffff;
            --muted-text: #888888;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Top Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(5, 5, 5, 0.95);
            position: sticky;
            top: 0;
            z-index: 90;
            border-bottom: 1px solid #1c1c1e;
            gap: 15px;
        }
        .logo {
            color: var(--accent-color); 
            text-shadow: 0 0 10px var(--accent-color); 
            font-size: 1.6rem; 
            font-weight: bold;
            margin: 0;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .header-search-box {
            display: none; 
            flex: 1;
            max-width: 400px;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            padding: 4px 6px 4px 14px;
            align-items: center;
            gap: 8px;
        }
        .header-search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }
        .header-search-btn {
            background: var(--accent-color);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
        }

        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--accent-color);
            padding: 5px;
        }

        /* PAGE 1: LANDING */
        .landing-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 85vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            background: linear-gradient(180deg, rgba(5,5,5,0.4) 0%, rgba(5,5,5,1) 100%), 
                        url('https://images.alphacoders.com/134/1344238.png') center/cover no-repeat;
        }
        
        .hero-search-container { width: 100%; max-width: 550px; margin-bottom: 30px; }
        .search-box { 
            display: flex; 
            background: rgba(17, 17, 17, 0.9);
            border: 2px solid #222;
            border-radius: 30px; 
            padding: 6px 6px 6px 18px;
            gap: 10px; 
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .search-box input { flex: 1; border: none; background: transparent; color: #fff; font-size: 16px; outline: none; }
        .search-btn { background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 11px 26px; border-radius: 25px; cursor: pointer; }
        .watch-now-btn {
            background: var(--accent-color);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 16px 50px;
            border-radius: 35px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* PAGE 2: HUB */
        .portal-dashboard { display: none; width: 100%; }
        .content-container { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
        @media (max-width: 900px) { .content-container { grid-template-columns: 1fr; } }
        
        .section-header { margin: 25px 0 15px 0; border-left: 4px solid var(--accent-color); padding-left: 12px; }
        .section-title { color: #fff; font-size: 1.3rem; font-weight: bold; }
        
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
        .anime-card { background: var(--container-bg); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #1c1c1e; }
        .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .anime-card .info-box { padding: 10px; }
        .anime-card .title { font-size: 0.85rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* VIDEO */
        .stream-view { display: none; max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent-color); }
        iframe { width: 100%; height: 100%; border: none; }
        
        .audio-toggle-container { margin: 15px auto; display: flex; justify-content: center; gap: 10px; }
        .audio-btn { background: #1c1c1e; color: #fff; padding: 8px 20px; border-radius: 20px; cursor: pointer; border: 1px solid #2c2c2e; }
        .audio-btn.active { background: var(--accent-color); color: #000; }
        
        .ep-title { color: var(--accent-color); font-size: 1.3rem; margin-top: 25px; }
        .episode-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0 40px 0; }
        .ep-btn { background: var(--container-bg); color: #fff; border: 1px solid #222; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        .ep-btn.active { background: var(--accent-color); color: #000; }

        /* THEME MODAL */
        .bottom-sheet-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1c1c1e; border-radius: 24px 24px 0 0; padding: 24px; z-index: 1001; transition: bottom 0.3s; }
        .bottom-sheet.open { bottom: 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="homeReturnReset()">dude9anime</div>
        <div id="header-search-engine" class="header-search-box">
            <input type="text" id="header-search-input" placeholder="Search anime titles...">
            <button class="header-search-btn" onclick="triggerCatalogSearch(true)">Search</button>
        </div>
        <button class="settings-icon" onclick="openBottomSheet()">⚙️</button>
    </header>

    <div id="landing-portal" class="landing-screen">
        <div class="hero-search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search anime titles directly...">
                <button class="search-btn" onclick="triggerCatalogSearch(false)">Search</button>
            </div>
        </div>
        <button class="watch-now-btn" onclick="openExplorationHub()">Watch Now</button>
    </div>

    <div id="main-exploration-hub" class="portal-dashboard">
        <div class="content-container" id="grid-split-container">
            <div class="main-panel">
                <div id="recommendations-container-block">
                    <div class="section-header"><h2 class="section-title">Editor Recommendations</h2></div>
                    <div id="recommendations-scroller" class="scroll-row" style="display:flex; gap:15px; overflow-x:auto;"></div>
                </div>
                <div class="section-header"><h2 class="section-title" id="grid-header-title">Recently Added</h2></div>
                <div id="results-grid" class="anime-grid"></div>
            </div>
            <div class="side-panel" id="sidebar-container-block">
                <div class="section-header"><h2 class="section-title">Schedule</h2></div>
                <div id="schedule-box"></div>
            </div>
        </div>
    </div>

    <div id="stream-dashboard-box" class="stream-view">
        <div id="player-box" class="player-container">
            <iframe id="video-iframe" src="" allowfullscreen scrolling="no"></iframe>
        </div>
        <div id="audio-toggles" class="audio-toggle-container">
            <button id="sub-btn" class="audio-btn active" onclick="setLanguage('sub')">SUB</button>
            <button id="dub-btn" class="audio-btn" onclick="setLanguage('dub')">DUB</button>
        </div>
        <h3 id="ep-title" class="ep-title">Available Episodes</h3>
        <div id="episode-buttons" class="episode-list"></div>
    </div>

    <script>
        const MAL_PLAYER_BASE = "https://megaplay.buzz/stream/mal";
        let currentEpisodeIndex = 1;
        let currentLanguage = 'sub';
        let currentMalId = "";

        function openExplorationHub() {
            document.getElementById('landing-portal').style.display = 'none';
            document.getElementById('main-exploration-hub').style.display = 'block';
            document.getElementById('header-search-engine').style.display = 'flex';
            loadMainHubFeeds();
        }

        function homeReturnReset() {
            document.getElementById('stream-dashboard-box').style.display = 'none';
            document.getElementById('main-exploration-hub').style.display = 'none';
            document.getElementById('header-search-engine').style.display = 'none';
            document.getElementById('landing-portal').style.display = 'flex';
        }

        async function loadMainHubFeeds() {
            try {
                const res = await fetch("https://api.jikan.moe/v4/top/anime?limit=12");
                const json = await res.json();
                const container = document.getElementById('results-grid');
                container.innerHTML = '';
                json.data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `<img src="${anime.images.jpg.image_url}"><div class="info-box"><div class="title">${anime.title}</div></div>`;
                    card.onclick = () => loadStreamingLayout(anime.mal_id, anime.title, anime.episodes || 12);
                    container.appendChild(card);
                });
            } catch (err) {}
        }

        function loadStreamingLayout(malId, titleName, totalEpisodes) {
            currentMalId = malId;
            document.getElementById('main-exploration-hub').style.display = 'none';
            document.getElementById('stream-dashboard-box').style.display = 'block';
            document.getElementById('ep-title').innerText = `Watching: ${titleName}`;
            const epBox = document.getElementById('episode-buttons');
            epBox.innerHTML = '';
            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.id = `ep-choice-${i}`;
                btn.innerText = `${i}`;
                btn.onclick = () => launchVideoPlayer(i);
                epBox.appendChild(btn);
            }
            launchVideoPlayer(1);
        }

        function launchVideoPlayer(epNum) {
            currentEpisodeIndex = epNum;
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`ep-choice-${epNum}`).classList.add('active');
            document.getElementById('video-iframe').src = `${MAL_PLAYER_BASE}/${currentMalId}/${epNum}/${currentLanguage}`;
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('sub-btn').classList.toggle('active', lang === 'sub');
            document.getElementById('dub-btn').classList.toggle('active', lang === 'dub');
            launchVideoPlayer(currentEpisodeIndex);
        }

        window.addEventListener("message", function (event) {
            let data = event.data;
            if (typeof data === "string") { try { data = JSON.parse(data); } catch (e) { return; } }
            if (data && data.event === "complete") { launchVideoPlayer(currentEpisodeIndex + 1); }
        });
    </script>
</body>
</html>
