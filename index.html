<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dude9anime</title>
    <style>
        :root {
            --bg-color: #050505;
            --container-bg: #111111;
            --accent-color: #00ff66; /* Default Matrix Green */
            --text-color: #ffffff;
            --muted-text: #888888;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            transition: background 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 10px auto;
        }
        h1 { 
            color: var(--accent-color); 
            text-shadow: 0 0 10px var(--accent-color); 
            font-size: 2rem; 
            margin: 0;
        }
        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--accent-color);
            padding: 5px;
        }
        p { color: var(--muted-text); margin-top: 0; font-size: 0.9rem; }
        
        .search-box { display: flex; max-width: 500px; margin: 20px auto; gap: 10px; padding: 0 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #222; background: var(--container-bg); color: var(--text-color); font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }
        .search-btn { background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 0 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }

        .section-title { color: var(--accent-color); font-size: 1.1rem; margin: 20px auto 10px auto; font-weight: bold; text-align: left; max-width: 1000px; padding: 0 10px; }

        /* Video Player Box */
        .player-container { max-width: 800px; margin: 20px auto; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent-color); box-shadow: 0 0 15px var(--accent-color); display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Sub / Dub Toggles */
        .audio-toggle-container { margin: 15px auto; display: none; justify-content: center; gap: 10px; max-width: 800px; }
        .audio-btn { background: #222; color: #fff; border: 1px solid #444; padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .audio-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        /* Anime Grid Cards */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 1000px; margin: 10px auto 30px auto; padding: 10px; }
        .anime-card { background: var(--container-bg); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; border: 1px solid #222; text-align: left; }
        .anime-card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }
        .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
        .anime-card .title { padding: 10px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); }

        /* Episode Panel */
        .episodes-title { margin-top: 20px; display: none; color: var(--accent-color); font-size: 1.2rem; }
        .episode-list { max-width: 800px; margin: 15px auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .ep-btn { background: var(--container-bg); color: var(--text-color); border: 1px solid #333; padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer; min-width: 60px; }
        .ep-btn:hover, .ep-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; box-shadow: 0 0 8px var(--accent-color); }

        /* RGB Settings Modal Styling */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #121214; border: 2px solid var(--accent-color); padding: 25px; border-radius: 16px; max-width: 320px; width: 85%; text-align: left; position: relative; }
        .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; color: var(--muted-text); }
        
        .theme-section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-text); margin: 15px 0 8px 0; font-weight: bold; }
        
        /* Custom RGB Slider Components */
        .rgb-container { background: #1c1c21; padding: 12px; border-radius: 10px; border: 1px solid #2d2d35; margin-bottom: 15px; }
        .slider-row { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .slider-row:last-child { margin-bottom: 0; }
        .slider-row label { width: 20px; font-weight: bold; font-size: 14px; }
        .slider-row input[type="range"] { flex: 1; accent-color: var(--accent-color); }
        .slider-row span { width: 35px; text-align: right; font-size: 13px; font-family: monospace; color: #aaa; }
        
        .color-preview-box { height: 35px; border-radius: 6px; border: 1px solid #444; margin-top: 10px; background: var(--accent-color); }

        /* Custom Background Selector Cards */
        .custom-options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .option-tile { background: #1c1c21; border: 2px solid #2d2d35; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; color: #eee; }
        .option-tile.selected { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.02); }
        
        .save-theme-btn { background: var(--accent-color); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 id="brand-logo" onclick="location.reload()" style="cursor:pointer;">dude9anime</h1>
        <button class="settings-icon" onclick="toggleModal(true)">⚙️</button>
    </div>
    <p>Your Next Anime Adventure Awaits</p>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Search anime by title (e.g. Naruto, Bleach, One Piece)...">
        <button class="search-btn" onclick="searchAnime()">Search</button>
    </div>

    <div class="section-title" id="grid-header">Trending Anime Broadcasts</div>
    <div id="results-grid" class="anime-grid"></div>

    <div id="player-box" class="player-container">
        <iframe id="video-iframe" src="" allowfullscreen scrolling="no"></iframe>
    </div>

    <div id="audio-toggles" class="audio-toggle-container">
        <button id="sub-btn" class="audio-btn active" onclick="setLanguage('sub')">SUB</button>
        <button id="dub-btn" class="audio-btn" onclick="setLanguage('dub')">DUB</button>
    </div>

    <h3 id="ep-title" class="episodes-title">Available Episodes</h3>
    <div id="episode-buttons" class="episode-list"></div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            <h3 style="margin-top: 0; color: var(--accent-color); font-size: 1.3rem;">Customization Engine</h3>
            
            <div class="theme-section-title">RGB Accent Mixer</div>
            <div class="rgb-container">
                <div class="slider-row">
                    <label style="color: #ff4444;">R</label>
                    <input type="range" id="range-r" min="0" max="255" value="0" oninput="updateRgbMixer()">
                    <span id="val-r">0</span>
                </div>
                <div class="slider-row">
                    <label style="color: #00ff66;">G</label>
                    <input type="range" id="range-g" min="0" max="255" value="255" oninput="updateRgbMixer()">
                    <span id="val-g">255</span>
                </div>
                <div class="slider-row">
                    <label style="color: #00ccff;">B</label>
                    <input type="range" id="range-b" min="0" max="255" value="102" oninput="updateRgbMixer()">
                    <span id="val-b">102</span>
                </div>
                <div class="color-preview-box" id="rgb-preview"></div>
            </div>

            <div class="theme-section-title">Background Theme</div>
            <div class="custom-options-grid" id="bg-tiles-container">
                <div class="option-tile selected" data-value="pitch-black" onclick="selectBgTile('pitch-black', this)">Pitch Black</div>
                <div class="option-tile" data-value="dark-gray" onclick="selectBgTile('dark-gray', this)">Dark Charcoal</div>
            </div>

            <button class="save-theme-btn" onclick="saveTheme()">Apply Configurations</button>
        </div>
    </div>

    <script>
        const MAL_PLAYER_BASE = "https://megaplay.buzz/stream/mal";

        // App States
        let currentEpisodeIndex = 1;
        let currentLanguage = 'sub';
        let currentMalId = "";
        let selectedBgValue = "pitch-black";
        
        // RGB Default Active Mixers (Green)
        let rVal = 0, gVal = 255, bVal = 102;

        function toggleModal(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        // Real-time RGB visual feedback as the user drags sliders
        function updateRgbMixer() {
            rVal = document.getElementById('range-r').value;
            gVal = document.getElementById('range-g').value;
            bVal = document.getElementById('range-b').value;

            document.getElementById('val-r').innerText = rVal;
            document.getElementById('val-g').innerText = gVal;
            document.getElementById('val-b').innerText = bVal;

            const hexColor = `rgb(${rVal}, ${gVal}, ${bVal})`;
            document.getElementById('rgb-preview').style.backgroundColor = hexColor;
        }

        function selectBgTile(value, element) {
            document.querySelectorAll('#bg-tiles-container .option-tile').forEach(t => t.classList.remove('selected'));
            element.classList.add('selected');
            selectedBgValue = value;
        }

        function saveTheme() {
            let bg = "#050505", container = "#111111";
            if (selectedBgValue === "dark-gray") { bg = "#1a1a1e"; container = "#252529"; }

            const targetColor = `rgb(${rVal}, ${gVal}, ${bVal})`;
            
            document.documentElement.style.setProperty('--accent-color', targetColor);
            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--container-bg', container);

            // Persist parameters inside local storage memory
            localStorage.setItem('dude9anime-r', rVal);
            localStorage.setItem('dude9anime-g', gVal);
            localStorage.setItem('dude9anime-b', bVal);
            localStorage.setItem('dude9anime-bg', selectedBgValue);
            
            toggleModal(false);
        }

        function loadSavedTheme() {
            const savedR = localStorage.getItem('dude9anime-r');
            const savedG = localStorage.getItem('dude9anime-g');
            const savedB = localStorage.getItem('dude9anime-b');
            const savedBgMode = localStorage.getItem('dude9anime-bg');

            if (savedR !== null && savedG !== null && savedB !== null) {
                rVal = savedR; gVal = savedG; bVal = savedB;
                document.getElementById('range-r').value = rVal;
                document.getElementById('range-g').value = gVal;
                document.getElementById('range-b').value = bVal;
                updateRgbMixer();
                document.documentElement.style.setProperty('--accent-color', `rgb(${rVal}, ${gVal}, ${bVal})`);
            }
            if (savedBgMode) {
                selectedBgValue = savedBgMode;
                let bg = "#050505", container = "#111111";
                if (savedBgMode === "dark-gray") { bg = "#1a1a1e"; container = "#252529"; }
                document.documentElement.style.setProperty('--bg-color', bg);
                document.documentElement.style.setProperty('--container-bg', container);
                document.querySelectorAll('#bg-tiles-container .option-tile').forEach(tile => {
                    tile.classList.toggle('selected', tile.getAttribute('data-value') === savedBgMode);
                });
            }
        }

        // Load Default Top Anime Grid on Startup via Jikan Live API
        async function loadHomepage() {
            loadSavedTheme();
            document.getElementById('results-grid').innerHTML = "<p>Loading anime dashboard directory...</p>";
            try {
                const res = await fetch("https://api.jikan.moe/v4/top/anime?limit=12");
                const json = await res.json();
                displayAnimeGrid(json.data);
            } catch (err) {
                document.getElementById('results-grid').innerHTML = "<p>Network timeout loading dashboard. Try searching a title directly.</p>";
            }
        }

        // SEARCH ENGINE: Connects search input straight to global live Jikan API catalogs
        async function searchAnime() {
            const query = document.getElementById('search-input').value.trim();
            if(!query) return alert("Type an anime title first!");
            
            document.getElementById('results-grid').innerHTML = "<p>Searching database directory...</p>";
            document.getElementById('grid-header').innerText = `Search Results for: "${query}"`;
            
            try {
                // Fetch direct text-matching queries straight from public database indexes
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=16`);
                const json = await res.json();
                
                if(!json.data || json.data.length === 0) {
                    document.getElementById('results-grid').innerHTML = "<p>No matches found. Try checking your spelling.</p>";
                } else {
                    displayAnimeGrid(json.data);
                }
            } catch (err) {
                document.getElementById('results-grid').innerHTML = "<p>Search system busy. Please try again in a few seconds.</p>";
            }
        }

        function displayAnimeGrid(animeDataArray) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';
            grid.style.display = 'grid';
            
            animeDataArray.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                // Pull title and standardized high quality poster images
                const title = anime.title_english || anime.title;
                const image = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url;
                
                card.innerHTML = `
                    <img src="${image || 'https://via.placeholder.com/150x225?text=No+Poster'}" alt="Poster">
                    <div class="title">${title}</div>
                `;
                // Map item click to activate MegaPlay multi-server catalog stream configurations using mal_id
                card.onclick = () => loadStreamingLayout(anime.mal_id, title, anime.episodes || 24);
                grid.appendChild(card);
            });
        }

        function loadStreamingLayout(malId, titleName, totalEpisodes) {
            currentMalId = malId;
            
            document.getElementById('results-grid').style.display = 'none';
            document.getElementById('grid-header').style.display = 'none';
            
            document.getElementById('player-box').style.display = 'block';
            document.getElementById('audio-toggles').style.display = 'flex';
            document.getElementById('ep-title').style.display = 'block';
            document.getElementById('ep-title').innerText = `Watching: ${titleName}`;
            
            const epBox = document.getElementById('episode-buttons');
            epBox.innerHTML = '';

            // Handle situations where total episodes are unknown/continuous 
            const totalCount = totalEpisodes || 50;

            // Generate full selection panels matching available streams completely automatically
            for (let i = 1; i <= totalCount; i++) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.id = `ep-choice-${i}`;
                btn.innerText = `${i}`;
                btn.onclick = () => launchVideoPlayer(i);
                epBox.appendChild(btn);
            }
            
            launchVideoPlayer(1);
        }

        function launchVideoPlayer(epNum) {
            currentEpisodeIndex = epNum;
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`ep-choice-${epNum}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Formulate endpoint utilizing direct high-capacity server matching matrices
            [span_0](start_span)const streamUrl = `${MAL_PLAYER_BASE}/${currentMalId}/${epNum}/${currentLanguage}`;[span_0](end_span)
            document.getElementById('video-iframe').src = streamUrl;
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('sub-btn').classList.toggle('active', lang === 'sub');
            document.getElementById('dub-btn').classList.toggle('active', lang === 'dub');
            launchVideoPlayer(currentEpisodeIndex);
        }

        // Auto-Next Message Engine Hook from MegaPlay Ecosystem Logs
        window.addEventListener("message", function (event) {
            let data = event.data;
            if (typeof data === "string") {
                try { data = JSON.parse(data); } catch (e) { return; }
            }

            [span_1](start_span)if (data && data.event === "complete") {[span_1](end_span)
                launchVideoPlayer(currentEpisodeIndex + 1);
            }
        });

        window.onload = loadHomepage;
    </script>
</body>
</html>
